# Render Blueprint — Botir AI (hackathon MVP)
# Two separate services: web (ai-assistant) + backend API (ai-assistant-api).
# Dashboard → New → Blueprint → this repo. Secrets marked `sync: false` are entered in the dashboard.
services:
  - type: web
    name: ai-assistant-api
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    # scripts/prisma.mjs picks the Prisma provider from DATABASE_URL (postgres:// → Postgres, file: → SQLite).
    # generate runs again at start so a DATABASE_URL change applied with "Save and deploy" (no rebuild) still works.
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter api run db:generate
    startCommand: cd apps/api && node scripts/prisma.mjs generate && node scripts/prisma.mjs db push --skip-generate && npx tsx src/seed.ts && npx tsx src/main.ts
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Persistent data: paste the Render Postgres *Internal* Database URL (postgresql://…), see apps/api/README.md.
      # file:./dev.db = SQLite on the free plan's ephemeral disk: wiped on every deploy/restart.
      # The seed is create-only (owner edits survive). Optional SEED_DEMO_PASSWORD (dashboard) = password of the 2 demo accounts.
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: https://ai-assistant-f16u.onrender.com,http://localhost:3000
      - key: WEB_URL
        value: https://ai-assistant-f16u.onrender.com
      - key: PUBLIC_API_URL
        value: https://ai-assistant-api-u384.onrender.com
      - key: LLM_MODE
        value: sdk
      - key: AUTH_SECRET
        generateValue: true
      # Claude Agent SDK auth (`claude setup-token`) — without it AI negotiation fails.
      - key: CLAUDE_CODE_OAUTH_TOKEN
        sync: false
      - key: TEZCHECK_API_KEY
        sync: false
      - key: TEZCHECK_CASH_DESK_CODE
        sync: false
      # Plans: first PRO month PLAN_PRO_INTRO_PRICE (once per account), then PLAN_PRO_PRICE / PLAN_MAX_PRICE per 30 days.
      # Tokens (real Claude input+output tokens) are a daily allowance, reset 00:00 Asia/Tashkent. BILLING_ENFORCE=1 turns the 402 gates on.
      - key: PLAN_PRO_INTRO_PRICE
        value: "1000"
      - key: PLAN_PRO_PRICE
        value: "82000"
      - key: PLAN_MAX_PRICE
        value: "163000"
      - key: PLAN_PRO_DAILY_TOKENS
        value: "100000"
      - key: PLAN_MAX_DAILY_TOKENS
        value: "200000"
      - key: BILLING_ENFORCE
        value: "0"
      - key: KNOWLEDGE_DAILY_CAP
        value: "30"
      # /agent/request abuse limits. Demo venue = one shared Wi-Fi IP, so the per-IP window is generous.
      - key: AGENT_RATE_LIMIT
        value: "30"
      - key: AGENT_DAILY_CAP
        value: "200"
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: LLM_MAX_CONCURRENCY
        value: "2"
      - key: LLM_EFFORT
        value: low

  - type: web
    name: ai-assistant
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter web build
    startCommand: pnpm --filter web start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_API_URL
        value: https://ai-assistant-api-u384.onrender.com
      # SEO / analitika: dashboard'da to'ldiriladi (bo'sh bo'lsa o'chiq)
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: NEXT_PUBLIC_GA_ID
        sync: false
      - key: NEXT_PUBLIC_GSC_VERIFICATION
        sync: false
